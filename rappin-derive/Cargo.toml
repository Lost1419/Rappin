[package]
name = "rappin-rs-derive"
version = "2.0.0-dev.1"
edition = "2021"
rust-version = "1.89"
description = "Optional command argument derives for Rappin"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lost1419/Rappin"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
proc-macro-crate = "3"
