[package]
name = "rappin"
version = "0.1.0"
edition = "2021"
description = "Fast, idiomatic Rust client and bot framework for Yapin’ (yapin.gg)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lost1419/Rappin"
homepage = "https://github.com/Lost1419/Rappin"
readme = "README.md"
keywords = ["yapin", "bot", "api", "chat", "async"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
async-trait = "0.1"
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
