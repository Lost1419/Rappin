[package]
name = "rappin-rs"
version = "2.0.0-dev.1"
edition = "2021"
rust-version = "1.89"
autobins = false
description = "Fast, idiomatic Rust client and bot framework for Yapin’ (yapin.gg)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lost1419/Rappin"
homepage = "https://github.com/Lost1419/Rappin"
readme = "README.md"
keywords = ["yapin", "bot", "api", "chat", "async"]
categories = ["api-bindings", "asynchronous"]
# Maintainer tooling and historical evidence are distributed through GitHub.
exclude = [
    ".github/**",
    "skills/**",
    "fuzz/**",
    "scripts/check-*",
    "scripts/test_*",
    "scripts/measure-build.py",
    "docs/api-support-*.json",
    "docs/api-support-*.md",
    "docs/sdk-build-*.json",
    "docs/sdk-performance-*.json",
    "docs/sdk-performance-*.md",
    "docs/advert.md",
    "tests/*_test.rs",
    "tests/support/failure_gateway.rs",
    "tests/support/failure_worker.rs",
    "tests/support/gateway_drain.rs",
    "docs/history/**",
    "docs/api-1.*.md",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "rappin"
path = "src/lib.rs"

[[bin]]
name = "rappin"
path = "src/bin/rappin.rs"
required-features = ["cli"]

[features]
default = []
derive = ["dep:rappin-rs-derive"]
cli = ["dep:clap", "dep:toml", "dep:fs2", "tokio/io-std", "tokio/io-util"]
gateway = ["dep:tokio-tungstenite", "dep:log", "dep:http"]
voice = ["tokio/process", "tokio/io-util"]
hot-reload = ["tokio/process", "tokio/io-util", "tokio/io-std"]
webhook-middleware = ["dep:axum", "dep:hex"]
metrics = ["metrics-http", "metrics-exporter-prometheus/push-gateway"]
metrics-http = ["dep:metrics", "dep:metrics-exporter-prometheus"]

[dependencies]
rappin-rs-derive = { version = "=2.0.0-dev.1", path = "rappin-derive", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
async-trait = "0.1"
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
base64 = "0.22"
sha2 = "0.11"
hmac = "0.13"
log = { version = "0.4", optional = true }
http = { version = "1", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
toml = { version = "0.9", optional = true }
fs2 = { version = "0.4", optional = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"], optional = true }
axum = { version = "0.8", optional = true }
hex = { version = "0.4", optional = true }
metrics = { version = "0.22", optional = true }
metrics-exporter-prometheus = { version = "0.14", optional = true, default-features = false, features = ["http-listener"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
tower = { version = "0.5", features = ["util"] }
proptest = "1.7"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# Opt-in local builds with small artifacts; normal dev/test profiles are unchanged.
[profile.compact]
inherits = "dev"
debug = 0
incremental = false

# Opt-in executable-size profile. Retains unwinding for handler failure reporting.
[profile.small]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[[example]]
name = "hot_cog_worker"
required-features = ["hot-reload"]

[[example]]
name = "hot_reload_bot"
required-features = ["hot-reload"]

[[example]]
name = "hot_reload_diagnostics"
required-features = ["hot-reload"]

[[example]]
name = "role_hierarchy_worker"
required-features = ["hot-reload"]

[[example]]
name = "gateway_api_requests"
required-features = ["gateway"]

[[example]]
name = "gateway_bot"
required-features = ["gateway"]

[[example]]
name = "tutorial_bot"
required-features = ["gateway", "derive"]

[[example]]
name = "shared_webhook_polling"
required-features = ["webhook-middleware"]

[[bench]]
name = "sdk"
harness = false

[workspace]
members = ["rappin-derive"]
exclude = ["fuzz"]
resolver = "2"
