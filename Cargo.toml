[package]
name = "rappin-rs"
version = "0.1.8"
edition = "2021"
rust-version = "1.88"
autobins = false
description = "Fast, idiomatic Rust client and bot framework for Yapin’ (yapin.gg)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lost1419/Rappin"
homepage = "https://github.com/Lost1419/Rappin"
readme = "README.md"
keywords = ["yapin", "bot", "api", "chat", "async"]
categories = ["api-bindings", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "rappin"
path = "src/lib.rs"

[[bin]]
name = "rappin"
path = "src/bin/rappin.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:toml", "tokio/io-std", "tokio/io-util"]
gateway = ["dep:tokio-tungstenite", "dep:log"]
voice = ["tokio/process", "tokio/io-util"]
hot-reload = ["tokio/process", "tokio/io-util", "tokio/io-std"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
async-trait = "0.1"
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
base64 = "0.22"
sha2 = "0.11"
hmac = "0.13"
log = { version = "0.4", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
toml = { version = "0.9", optional = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"

[[example]]
name = "hot_cog_worker"
required-features = ["hot-reload"]

[[example]]
name = "hot_reload_bot"
required-features = ["hot-reload"]
