[package]
name = "rappin-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rappin = { package = "rappin-rs", path = "..", features = ["hot-reload"] }
serde_json = "1"

[workspace]
members = ["."]

[[bin]]
name = "events"
path = "fuzz_targets/events.rs"
test = false
doc = false
bench = false

[[bin]]
name = "arguments"
path = "fuzz_targets/arguments.rs"
test = false
doc = false
bench = false
