name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  api-audit-skill:
    name: API audit skill tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test offline snapshots and release coverage
        run: python -B -m unittest discover -s skills/yapin-api-audit/scripts -p 'test_*.py'

  compatibility:
    name: Public API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: all-features

  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check format
        run: cargo fmt --check

      - name: Clippy check
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-features --all-targets

      - name: Check examples
        run: cargo check --examples

      - name: Check public documentation
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: cargo doc --locked --all-features --no-deps

      - name: Check documentation examples
        run: cargo test --locked --all-features --doc

      - name: Check minimal documentation examples
        run: cargo test --locked --no-default-features --doc

      - name: Check README and every guide
        if: runner.os == 'Linux'
        run: python3 scripts/check-guides.py

      - name: Check minimal library
        run: cargo check --no-default-features

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run security audit
        run: cargo audit
