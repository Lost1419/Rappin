name: CI
run-name: 'Test suite · ${{ github.head_ref || github.ref_name }} · #${{ github.run_number }}'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full test suite instead of documentation checks
        type: boolean
        default: false
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Rustdoc coverage flags and cargo-fuzz depend on nightly; pin it so a new nightly
  # can't break CI unannounced. Bump deliberately (see docs/development.md).
  PINNED_NIGHTLY: nightly-2026-11-19

jobs:
  changes:
    name: Classify CI changes
    runs-on: ubuntu-latest
    outputs:
      markdown-only: ${{ steps.diff.outputs.markdown-only }}
      guides: ${{ steps.diff.outputs.guides }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select documentation checks or the full suite
        id: diff
        if: github.event_name != 'schedule'
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          FULL_SUITE: ${{ inputs.full_suite }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$FULL_SUITE" != "true" ]]; then
              echo "markdown-only=true" >> "$GITHUB_OUTPUT"
              echo "guides=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            range="$PR_BASE...$PR_HEAD"
          else
            range="$PUSH_BEFORE..$GITHUB_SHA"
          fi
          # Unavailable history or an empty diff leaves the full suite enabled.
          if ! git diff --name-only --no-renames -z "$range" -- > "$RUNNER_TEMP/changed-paths"; then
            exit 0
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          paths = (Path(os.environ["RUNNER_TEMP"]) / "changed-paths").read_bytes().split(b"\0")[:-1]
          root_docs = {b"README.md", b"CHANGELOG.md"}
          if paths and all(
              path in root_docs or (path.startswith((b"docs/", b"skills/")) and path.endswith(b".md"))
              for path in paths
          ):
              guides = any(path == b"README.md" or path.startswith(b"docs/") for path in paths)
              with open(os.environ["GITHUB_OUTPUT"], "a") as outputs:
                  print("markdown-only=true", file=outputs)
                  print(f"guides={str(guides).lower()}", file=outputs)
          PY

  markdown-guides:
    name: Markdown guide checks
    needs: changes
    if: needs.changes.outputs.markdown-only == 'true' && needs.changes.outputs.guides == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fetch --locked
      - name: Check public documentation
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: cargo doc --locked --all-features --no-deps
      - name: Check README and every guide
        run: python3 scripts/check-guides.py

  api-audit-skill:
    if: github.event_name != 'schedule'
    name: API audit skill tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Test offline snapshots and release coverage
        run: python -B -m unittest discover -s skills/yapin-api-audit/scripts -p 'test_*.py'

  minimum-rust:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.markdown-only != 'true' }}
    name: Rust 1.89 / ${{ matrix.feature }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [minimal, derive, cli, gateway, voice, hot-reload, webhook-middleware, metrics, metrics-http, all]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: msrv-${{ matrix.feature }}
      - name: Check isolated features on minimum Rust
        shell: bash
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          case "$FEATURE" in
            minimal) cargo check --locked --no-default-features --all-targets ;;
            all) cargo test --locked --all-features --lib ;;
            *) cargo check --locked --no-default-features --features "$FEATURE" --all-targets ;;
          esac

      - name: Check fresh consumer resolution on minimum Rust
        if: matrix.feature == 'all'
        shell: bash
        run: |
          mkdir -p target/msrv-consumer/src
          cat > target/msrv-consumer/Cargo.toml <<'EOF'
          [package]
          name = "rappin-msrv-consumer"
          version = "0.0.0"
          edition = "2021"
          rust-version = "1.89"
          [workspace]
          [dependencies]
          rappin-rs = { path = "../..", features = ["derive", "cli", "gateway", "voice", "hot-reload", "webhook-middleware", "metrics", "metrics-http"] }
          EOF
          echo 'fn main() { let _ = rappin::Client::new("unused-msrv-fixture"); }' > target/msrv-consumer/src/main.rs
          cargo check --manifest-path target/msrv-consumer/Cargo.toml --target-dir target --config 'resolver.incompatible-rust-versions="fallback"'

  documentation-coverage:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.changes.outputs.markdown-only != 'true' || needs.changes.outputs.guides == 'true') }}
    name: Documentation coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.PINNED_NIGHTLY }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Measure public items and examples
        run: cargo rustdoc --locked --all-features --lib -- -Z unstable-options --coverage --output-format json
      - name: Require 100 percent documented items and eligible examples
        run: python3 scripts/check-doc-coverage.py target/doc/rappin.json

  fuzz-smoke:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.markdown-only != 'true' }}
    name: Bounded offline fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.PINNED_NIGHTLY }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
          key: fuzz-x86_64-unknown-linux-gnu-address
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: mkdir -p fuzz/corpus/events fuzz/corpus/arguments
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu --sanitizer address events fuzz/corpus/events fuzz/seeds/events -- -max_total_time=15 -max_len=8192 -rss_limit_mb=1024
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu --sanitizer address arguments fuzz/corpus/arguments fuzz/seeds/arguments -- -max_total_time=15 -max_len=8192 -rss_limit_mb=1024
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: fuzz-crash-inputs
          path: fuzz/artifacts
          if-no-files-found: ignore

  compatibility:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.markdown-only != 'true' }}
    name: Public API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          feature-group: all-features

  test:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.markdown-only != 'true' }}
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Configure LLD for Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = (Get-Command lld-link.exe -ErrorAction SilentlyContinue).Source
          if (!$llvm) { $llvm = Join-Path $env:ProgramFiles 'LLVM/bin/lld-link.exe' }
          if (!(Test-Path $llvm)) { throw 'LLVM lld-link.exe unavailable' }
          $linker = $llvm.Replace('\', '/')
          # Worker builds inherit Cargo home through their filtered environment.
          @"

          [target.x86_64-pc-windows-msvc]
          linker = "$linker"
          rustdocflags = ["-Clinker=$linker"]
          "@ | Add-Content -Path (Join-Path $env:CARGO_HOME 'config.toml')
          & $llvm --version

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ runner.os == 'Windows' && 'msvc-lld' || '' }}

      - name: Check format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy check
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

      - name: Install nextest on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/rappin-nextest"
          mkdir -p "$tool_dir"
          archive="$tool_dir/cargo-nextest.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-universal-apple-darwin.tar.gz \
            -o "$archive"
          echo "2fadf57df4243e691f088ee3bff4f4ab9af16da0c95a1db84b5cb1685e098a76  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$tool_dir" cargo-nextest
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Run tests
        if: runner.os != 'macOS'
        env:
          RAPPIN_TEST_WORKER_TARGET: ${{ runner.temp }}/rappin-test-workers
        run: cargo test --locked --workspace --all-features --all-targets

      - name: Run tests with nextest
        if: runner.os == 'macOS'
        env:
          RAPPIN_TEST_WORKER_TARGET: ${{ runner.temp }}/rappin-test-workers
        run: cargo nextest run --locked --workspace --all-features --all-targets

      - name: Check public documentation
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: cargo doc --locked --all-features --no-deps

      - name: Check documentation examples
        run: cargo test --locked --all-features --doc

      - name: Check minimal documentation examples
        if: runner.os == 'Linux'
        run: cargo test --locked --no-default-features --doc

      - name: Check README and every guide
        if: runner.os == 'Linux'
        run: python3 scripts/check-guides.py

      - name: Verify published source package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo package --workspace --locked --offline --all-features
          rappin_package_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          # Check the SDK package against the derive package built here, not crates.io,
          # because a version bump is checked before the derive crate is published.
          cargo check --offline --all-features --all-targets --manifest-path "target/package/rappin-rs-$rappin_package_version/Cargo.toml" --target-dir target --config "patch.crates-io.rappin-rs-derive.path=\"$PWD/target/package/rappin-rs-derive-$rappin_package_version\""

  audit:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.changes.outputs.markdown-only != 'true') }}
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Identify cargo-audit build toolchain
        id: audit-toolchain
        run: echo "rustc=$(rustc --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo-audit executable
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/rappin-cargo-audit/bin/cargo-audit
          key: cargo-audit-0.23.0-${{ runner.os }}-${{ runner.arch }}-${{ steps.audit-toolchain.outputs.rustc }}
      - name: Install cargo-audit
        shell: bash
        run: |
          audit_root="$RUNNER_TEMP/rappin-cargo-audit"
          if [[ "$("$audit_root/bin/cargo-audit" --version 2>/dev/null)" != "cargo-audit 0.23.0" ]]; then
            cargo install cargo-audit --locked --version 0.23.0 --root "$audit_root" --force
          fi
          echo "$audit_root/bin" >> "$GITHUB_PATH"
      - name: Run security audit
        run: |
          status=0
          cargo audit || status=1
          cargo audit --no-fetch --file fuzz/Cargo.lock || status=1
          exit "$status"
