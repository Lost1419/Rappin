name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  api-audit-skill:
    name: API audit skill tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test offline snapshots and release coverage
        run: python -B -m unittest discover -s skills/yapin-api-audit/scripts -p 'test_*.py'

  minimum-rust:
    name: Rust 1.88 / ${{ matrix.feature }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [minimal, cli, gateway, voice, hot-reload, webhook-middleware, metrics, metrics-http, all]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.feature }}
      - name: Check isolated features on minimum Rust
        shell: bash
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          case "$FEATURE" in
            minimal) cargo check --locked --no-default-features --all-targets ;;
            all) cargo test --locked --all-features --lib ;;
            *) cargo check --locked --no-default-features --features "$FEATURE" --all-targets ;;
          esac

  documentation-coverage:
    name: Documentation coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Measure public items and examples
        run: cargo rustdoc --locked --all-features --lib -- -Z unstable-options --coverage --output-format json
      - name: Require 100 percent documented items and eligible examples
        run: python3 scripts/check-doc-coverage.py target/doc/rappin.json

  fuzz-smoke:
    name: Bounded offline fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: mkdir -p fuzz/corpus/events fuzz/corpus/arguments
      - run: cargo fuzz run events fuzz/corpus/events fuzz/seeds/events -- -max_total_time=15 -max_len=8192 -rss_limit_mb=1024
      - run: cargo fuzz run arguments fuzz/corpus/arguments fuzz/seeds/arguments -- -max_total_time=15 -max_len=8192 -rss_limit_mb=1024
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crash-inputs
          path: fuzz/artifacts
          if-no-files-found: ignore

  compatibility:
    name: Public API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: all-features

  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check format
        run: cargo fmt --check

      - name: Clippy check
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-features --all-targets

      - name: Check examples
        run: cargo check --examples

      - name: Check public documentation
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: cargo doc --locked --all-features --no-deps

      - name: Check documentation examples
        run: cargo test --locked --all-features --doc

      - name: Check minimal documentation examples
        run: cargo test --locked --no-default-features --doc

      - name: Check README and every guide
        if: runner.os == 'Linux'
        run: python3 scripts/check-guides.py

      - name: Verify published source package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo package --locked --offline --all-features
          rappin_package_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          cargo check --locked --offline --all-features --all-targets --manifest-path "target/package/rappin-rs-$rappin_package_version/Cargo.toml" --target-dir target

      - name: Check minimal library
        run: cargo check --no-default-features

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run security audit
        run: cargo audit
