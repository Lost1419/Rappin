name: Yapin API watch
run-name: 'Yapin API watch · ${{ github.event_name }} · #${{ github.run_number }}'

# Daily check of Yapin's public contract (openapi.json, developer guides,
# /version, /changelog) with skills/yapin-api-audit. A live change opens an
# issue (or comments on the open one). Only public, unauthenticated URLs.
on:
  schedule:
    # 19:00 UTC = 12:00 MST (UTC-7). GitHub cron is always UTC and has no DST;
    # noon Mountain daylight time would be 18:00 UTC. Runs can start late.
    - cron: '0 19 * * *'
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/yapin-api-watch.yml
      - .github/scripts/yapin_api_watch.py
      - .github/scripts/test_yapin_api_watch.py
      - skills/yapin-api-audit/scripts/audit.py

permissions:
  contents: read

concurrency:
  group: yapin-api-watch-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

# Scratch folders inside the checkout. Not hidden: upload-artifact skips hidden files.
env:
  CURRENT: yapin-watch/current
  PREVIOUS: yapin-watch/previous
  REPORT: yapin-watch/report

jobs:
  check:
    name: Check the live contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Offline watch tests
        run: python -B -m unittest discover -s .github/scripts -p 'test_*.py'
      # The previous snapshot lives in the Actions cache: each run restores the
      # newest one, and the save-baseline job stores this run's snapshot only after
      # any change notification succeeded. PR runs never touch it.
      - name: Restore the previous snapshot
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.PREVIOUS }}
          key: yapin-api-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: yapin-api-snapshot-
      - name: Snapshot the public contract
        run: python -B skills/yapin-api-audit/scripts/audit.py snapshot --out "$CURRENT" > /dev/null
      - name: Compare with the previous snapshot and docs/openapi.json
        id: check
        run: >-
          python -B .github/scripts/yapin_api_watch.py
          --current "$CURRENT" --previous "$PREVIOUS" --bundled docs/openapi.json
          --out "$REPORT"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      # Named per attempt so "Re-run all jobs" uploads a fresh artifact, while
      # "Re-run failed jobs" keeps this job's output and finds the original one.
      - name: Name the report artifact
        id: artifact
        run: echo "name=yapin-api-watch-report-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ env.REPORT }}
            ${{ env.CURRENT }}
          retention-days: 30

  notify:
    name: Open or update the change issue
    needs: check
    if: needs.check.outputs.changed == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.check.outputs.artifact }}
          path: report
      - name: Comment on the open issue, or open one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Yapin API contract changed
        run: |
          body="$(find report -name issue.md -print -quit)"
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi

  # Advancing the baseline is the last step. If the notification failed, the old
  # baseline stays, so the next run (or a re-run) reports the same change again
  # instead of losing it. A failure here at worst repeats a notification.
  save-baseline:
    name: Save this snapshot as the next baseline
    needs: [ check, notify ]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request'
      && needs.check.result == 'success'
      && (needs.notify.result == 'success' || needs.notify.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.check.outputs.artifact }}
          path: yapin-watch
      - name: Make this snapshot the next baseline
        run: rm -rf "$PREVIOUS" && mv "$CURRENT" "$PREVIOUS" && test -f "$PREVIOUS/manifest.json"
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.PREVIOUS }}
          key: yapin-api-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
