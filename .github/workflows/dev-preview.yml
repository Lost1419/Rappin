name: Dev preview build
run-name: 'Preview binaries · ${{ github.ref_name }} · #${{ github.run_number }}'

on:
  push:
    branches: [dev]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: dev-preview-build
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      date: ${{ steps.source.outputs.date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin the preview source
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build:
    name: CLI / ${{ matrix.platform }}
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux-x86_64, binary: rappin}
          - {runner: macos-15, platform: macos-arm64, binary: rappin}
          - {runner: windows-2022, platform: windows-x86_64, binary: rappin.exe}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: dev-preview-cli
      - name: Build the Rappin CLI
        run: cargo build --locked --release --bin rappin --features cli,gateway,voice
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check and package the preview
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          BUILD_DATE: ${{ needs.source.outputs.date }}
        run: |
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          binary = os.environ["BINARY"]
          source = Path("target/release", binary).resolve()
          version = subprocess.check_output([source, "--version"], encoding="utf-8").strip()
          capabilities = json.loads(subprocess.check_output([source, "capabilities"], encoding="utf-8"))
          crate_version = capabilities["data"]["version"]
          short_commit = os.environ["SOURCE_SHA"][:7]
          assert version == f"rappin {crate_version} ({short_commit})", version
          assert all(capabilities["data"]["features"][feature] for feature in ("cli", "gateway", "voice"))
          assert capabilities["data"]["tools"], "tool catalogue is empty"

          out = Path("preview")
          out.mkdir()
          shutil.copy2(source, out / binary)
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          (out / "SHA256SUMS").write_text(f"{digest}  {binary}\n", encoding="utf-8")
          build = {
              "version": version,
              "crate_version": crate_version,
              "source_commit": os.environ["SOURCE_SHA"],
              "date_utc": os.environ["BUILD_DATE"],
              "platform": os.environ["PLATFORM"],
              "rustc": subprocess.check_output(["rustc", "--version"], encoding="utf-8").strip(),
          }
          (out / "build.json").write_text(json.dumps(build, indent=2) + "\n", encoding="utf-8")
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: rappin-dev-${{ needs.source.outputs.date }}-${{ matrix.platform }}-${{ needs.source.outputs.sha }}
          path: preview/
          if-no-files-found: error
          retention-days: 14
      - name: List preview download in the run summary
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          preview = Path("preview")
          build = json.loads((preview / "build.json").read_text(encoding="utf-8"))
          checksum = (preview / "SHA256SUMS").read_text(encoding="utf-8").split()[0]
          artifact_url = os.environ["ARTIFACT_URL"]
          assert artifact_url.startswith("https://"), "artifact link is unavailable"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### {build['platform']}\n\n")
              summary.write(f"[Download {build['version']}]({artifact_url})\n\n")
              summary.write(f"Commit `{build['source_commit']}`\n\n")
              summary.write(f"SHA-256 `{checksum}`\n")
          PYTHON
