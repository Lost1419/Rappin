name: Windows linker benchmark

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: [.github/workflows/windows-linker-benchmark.yml]

permissions:
  contents: read

jobs:
  benchmark:
    name: Windows / ${{ matrix.linker }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        linker: [msvc, lld]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Prepare linker and collect runner configuration
        shell: pwsh
        env:
          LINKER: ${{ matrix.linker }}
        run: |
          Get-MpComputerStatus -ErrorAction SilentlyContinue |
            Select-Object AntivirusEnabled, RealTimeProtectionEnabled, AMRunningMode |
            Format-List
          rustc -Vv
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo fetch failed' }
          if ($env:LINKER -ne 'lld') { return }

          $llvm = (Get-Command lld-link.exe -ErrorAction SilentlyContinue).Source
          if (!$llvm) { $llvm = Join-Path $env:ProgramFiles 'LLVM/bin/lld-link.exe' }
          if (!(Test-Path $llvm)) { throw 'LLVM lld-link.exe unavailable' }
          $driver = Join-Path $env:RUNNER_TEMP 'rappin-link-driver.exe'
          $source = Join-Path $env:RUNNER_TEMP 'rappin-link-driver.rs'
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'rappin-lld-path.txt') -Value $llvm
          @'
          use std::{env, fs, io::Write, process::{self, Command}};

          fn main() -> std::io::Result<()> {
              let directory = env::current_exe()?.parent().unwrap().to_owned();
              let kind = match env::var("CARGO_PKG_NAME").as_deref() {
                  Ok("api12-worker" | "api14-resource-worker" | "gateway-request-worker") => "worker",
                  _ => "other",
              };
              let phase = fs::read_to_string(directory.join("rappin-link-phase.txt"))?;
              let mut evidence = fs::OpenOptions::new()
                  .create(true)
                  .append(true)
                  .open(directory.join("rappin-link-evidence.txt"))?;
              evidence.write_all(format!("{phase} {kind}\n").as_bytes())?;
              let linker = fs::read_to_string(directory.join("rappin-lld-path.txt"))?;
              let status = Command::new(linker.trim()).args(env::args_os().skip(1)).status()?;
              process::exit(status.code().unwrap_or(1));
          }
          '@ | Set-Content -Path $source
          rustc $source -o $driver
          if ($LASTEXITCODE -ne 0) { throw 'linker probe compilation failed' }

          # The worker build inherits Cargo home, including this benchmark config.
          $config = Join-Path $env:CARGO_HOME 'config.toml'
          $tomlPath = $driver.Replace('\', '/')
          @"

          [target.x86_64-pc-windows-msvc]
          linker = "$tomlPath"
          "@ | Add-Content -Path $config
          "CARGO_ENCODED_RUSTDOCFLAGS=-Clinker=$driver" >> $env:GITHUB_ENV

      - name: Measure cold and warm tests
        shell: pwsh
        env:
          RAPPIN_TEST_WORKER_TARGET: ${{ runner.temp }}/rappin-benchmark-workers
          RAPPIN_BENCH_TARGET: ${{ runner.temp }}/rappin-benchmark-target
        run: |
          $env:CARGO_TARGET_DIR = $env:RAPPIN_BENCH_TARGET
          $phase = Join-Path $env:RUNNER_TEMP 'rappin-link-phase.txt'
          $samples = @()
          function Measure-Tests($label, $arguments) {
            Set-Content -Path $phase -Value $label -NoNewline
            $defender = (Get-Process MsMpEng -ErrorAction SilentlyContinue).CPU
            $watch = [System.Diagnostics.Stopwatch]::StartNew()
            cargo @arguments
            if ($LASTEXITCODE -ne 0) { throw "$label failed" }
            $watch.Stop()
            $current = (Get-Process MsMpEng -ErrorAction SilentlyContinue).CPU
            $script:samples += [PSCustomObject]@{
              Phase = $label
              Seconds = [math]::Round($watch.Elapsed.TotalSeconds, 2)
              DefenderCpuSeconds = if ($null -ne $current -and $null -ne $defender) {
                [math]::Round($current - $defender, 2)
              }
            }
          }
          for ($sample = 0; $sample -lt 4; $sample++) {
            Measure-Tests 'runtime' @('test', '--locked', '--all-features', '--lib',
              '--test', 'gateway_requests_test', '--test', 'api12_worker_test',
              '--test', 'api14_worker_test', '--test', 'gateway_requests_worker_test')
            Measure-Tests 'doctests' @('test', '--locked', '--all-features', '--doc')
          }
          $samples | Format-Table -AutoSize | Out-String | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Verify LLD reached all three build paths
        if: matrix.linker == 'lld'
        shell: pwsh
        run: |
          $evidence = Get-Content (Join-Path $env:RUNNER_TEMP 'rappin-link-evidence.txt')
          foreach ($type in @('runtime other', 'runtime worker', 'doctests other')) {
            $count = @($evidence | Where-Object { $_ -eq $type }).Count
            if ($count -eq 0) { throw "no linker invocations for $type" }
            Write-Output "$type linker invocations: $count"
          }
